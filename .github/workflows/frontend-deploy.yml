name: Frontend Deploy
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "warning"
      tags:
        description: "Test scenario tags"
  release:
    types: [published]
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      - name: Generate
        working-directory: ./frontend
        run: npm run generate
        env:
          API_URL: https://api.cubing.gg
          IMAGE_SERVING_URL: https://cdn.cubing.gg
          VER: ${{ github.ref }}
          SITE_NAME: "CubingGG"
          SITE_DESCRIPTION: "CubingGG is an educational platform that helps you get faster at cubing by learning from world-class speedcubers"
          SITE_IMAGE_URL: https://cdn.cubing.gg/permanent/android-chrome-512x512.png
          SITE_CONTACT_EMAIL: support@cubing.gg
          SITE_DISCORD_LINK:
          SITE_GITHUB_REPOSITORY_URL:
          LOGO_HAS_LIGHT_VARIANT:
          DEFAULT_LIGHT_MODE:
          DEFAULT_GRID_VIEW:
          SOCIAL_LOGIN_ENABLED:
          TEMP_STORAGE_PATH: temp
          STORAGE_PATH_PREFIX:
          HIDE_NULL_INPUT_ICON: true
          STRIPE_PUB_KEY: pk_live_51NvoqQDPbTsKIyfJOF9h4jA6DNU1PBqQG2OHSTwniprfD0D0BbQQPCQJeQtTD9YoEFF0gGlTzZ4YTdA1Jcz8ALCD009Pf8QPxz
          PAYPAL_CLIENT_ID: AeJZEAUysSBUU7BbyBjqsXir_phkR7_EI2H7J7NRo93v56ZvErx99ESGTvShPuHDT2KK8ftlqJWgICb6
      - name: Create SA key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/gcloud.json
      - name: Deploy Hosting
        run: export GOOGLE_APPLICATION_CREDENTIALS=$HOME/gcloud.json && cd frontend && npx firebase-tools deploy --only hosting --json
